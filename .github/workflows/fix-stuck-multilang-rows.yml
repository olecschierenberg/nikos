name: Reparatur haengengebliebener Mehrsprachen-LP-Zeilen (2026-09-08)

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"): behebt die
# 3 Sheet-Zeilen, die durch den Publish-Bug (gitignore-Regel "lp/" + fehlendes git-add
# in lp-publish.yml, gefixt in Commit 8689568) permanent auf aktiv=x haengengeblieben
# sind, obwohl die Seite nie tatsaechlich live gegangen ist. Siehe
# automation/lp-generator/scripts/fix-stuck-multilang-rows.js fuer die genaue Liste,
# Unterscheidung PARTIAL/FULL und Begruendung.
#
# Ablauf Nutzer: 1) einmal OHNE Haken bei "live" laufen lassen (Dry-Run, Log pruefen),
# 2) danach erneut MIT Haken bei "live" laufen lassen (schreibt wirklich ins Sheet).
# Nach erfolgreichem Live-Lauf kann dieser Workflow wieder entfernt werden.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Vorschau im Log)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fix-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Haengengebliebene Zeilen reparieren
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then
            node scripts/fix-stuck-multilang-rows.js --live
          else
            node scripts/fix-stuck-multilang-rows.js
          fi
