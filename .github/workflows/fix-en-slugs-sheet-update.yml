name: "EN-Slug-Fix Sheet-Nachtrag: 4 Auslands-LPs (2026-09-09)"

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"): siehe
# automation/lp-generator/scripts/fix-en-slugs-sheet-update.js fuer Hintergrund.
#
# Ablauf Nutzer: 1) einmal OHNE Haken bei "live" laufen lassen (Dry-Run, Log pruefen),
# 2) danach erneut MIT Haken bei "live" laufen lassen (schreibt slug+pfad der 4
# betroffenen Zeilen im Tab "Keywordkombinationen" auf die neuen, korrekten Werte).
# Nach erfolgreichem Live-Lauf kann dieser Workflow wieder entfernt werden.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Vorschau im Log)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sheet-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sheet-Nachtrag durchfuehren
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then
            node scripts/fix-en-slugs-sheet-update.js --live
          else
            node scripts/fix-en-slugs-sheet-update.js
          fi
