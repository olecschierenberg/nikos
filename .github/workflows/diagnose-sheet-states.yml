name: "Diagnose: Sheet-Zeilenstatus Keywordkombinationen (2026-09-09)"

# EINMAL-DIAGNOSE-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run
# workflow"): rein lesend, siehe automation/lp-generator/scripts/
# diagnose-sheet-states.js. Beantwortet die Frage, welchen Status Zeilen
# mit deploy=x & aktiv=x aber ohne slug/Pfad/Erstellungsdatum haben.
# Nach Auswertung kann dieser Workflow wieder entfernt werden.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sheet-Diagnose ausfuehren
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/diagnose-sheet-states.js
