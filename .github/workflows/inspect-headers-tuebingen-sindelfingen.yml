name: "Diagnose: Header Stadt-Fakten/Keywordkombinationen (Tuebingen/Sindelfingen)"

# EINMAL-DIAGNOSE (nur manuell ueber "Run workflow"), rein lesend:
# siehe automation/lp-generator/scripts/inspect-headers-tuebingen-sindelfingen.js
# Bereitet die Vervollstaendigung der Stadt-Fakten fuer Tuebingen und die
# Wiederherstellung der ISF-Sindelfingen-Landingpage vor. Kann nach Gebrauch
# wieder entfernt werden.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Header + Zeilen dumpen
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/inspect-headers-tuebingen-sindelfingen.js
