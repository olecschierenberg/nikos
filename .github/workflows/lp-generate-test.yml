name: LP-Generator (Test, ohne n8n)

# Manueller Test-Workflow für die neue, n8n-freie Landingpage-Generierung.
# Läuft komplett getrennt vom laufenden n8n-Betrieb:
#  - liest dieselbe Warteschlange/Stadt-Fakten NUR lesend (kein Sheet-Update)
#  - schreibt AUSSCHLIESSLICH nach lp-preview/_ghtest-<slug>/index.html,
#    niemals in den produktiven lp-preview/<slug>/-Pfad
#  - "Landingpages veröffentlichen" (separater n8n-Workflow) bleibt unberührt
# Details: /nikos/Migrationsplan_Landingpage-Generator_ohne-n8n_2026-08-27.md
#
# Manuell auslösen: GitHub -> Actions -> "LP-Generator (Test, ohne n8n)" -> Run workflow.

on:
  workflow_dispatch: {}

concurrency:
  group: lp-generate-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-test-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Test-Landingpage generieren
        working-directory: automation/lp-generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index.js

      - name: Ergebnis committen (nur Test-Vorschau + QA-Lektionen-Datei)
        run: |
          git config user.name "nikos-lp-generator[bot]"
          git config user.email "actions@github.com"
          git add "lp-preview/_ghtest-*" "automation/lp-generator/data/qa-lektionen.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen (z. B. weil die Warteschlange leer war) — nichts zu committen."
          else
            git commit -m "Test-LP (GitHub-Actions-Generator, ohne n8n)"
            git push
          fi
