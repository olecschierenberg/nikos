name: Sitemap aktualisieren

on:
  push:
    branches:
      - main
  # NEU (2026-08-31): Fallback-Zeitplan, seit die neuen GitHub-Actions-
  # Automatisierungen (LP-Generator/-Publisher) per GITHUB_TOKEN pushen --
  # dieser Actor ist github-actions[bot], und der Guard unten
  # (github.actor != 'github-actions[bot]') ueberspringt solche Pushes
  # bewusst (verhindert Trigger-Ketten durch andere Bots). Ohne diesen
  # Schedule wuerde sitemap.xml nie mehr automatisch aktualisiert, sobald
  # ausschliesslich Bot-Commits passieren. Alle 6 Stunden reicht als
  # Sicherheitsnetz; der Job committet ohnehin nur bei echter Aenderung.
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: nikos-sitemap-main
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Websitebestand mit Historie auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sitemap aus indexierbaren Dateien erzeugen
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://nikos.info/
          include-pdf: false
          # 2026-09-02: die 37 alten Flat-Redirect-Stubs (nikos-*.html, index.html,
          # danke.html) haben KEIN noindex (Soft-Redirect via canonical, siehe
          # scripts/verify-sitemap.mjs) und wurden deshalb bei jedem Lauf wieder in
          # die Sitemap aufgenommen (Ahrefs: 'Nicht-kanonische Seite in Sitemap').
          # Explizit ausschliessen, da ihr canonical auf /de/ bzw. /en/ zeigt.
          exclude-paths: >
            /lp-preview
            /backups
            /migration
            /danke.html
            /index.html
            /nikos-agb.html
            /nikos-anwendung-baustelle.html
            /nikos-anwendung-festival.html
            /nikos-anwendung-festumzug.html
            /nikos-anwendung-firmenveranstaltung.html
            /nikos-anwendung-gedenkveranstaltung.html
            /nikos-anwendung-jubilaeumsfeier.html
            /nikos-anwendung-krisenlage.html
            /nikos-anwendung-parkfest.html
            /nikos-anwendung-sportevent.html
            /nikos-anwendung-stadtfest.html
            /nikos-anwendung-volksfest.html
            /nikos-anwendung-weihnachtsmarkt.html
            /nikos-anwendungen.html
            /nikos-datenschutz.html
            /nikos-downloads.html
            /nikos-impressum.html
            /nikos-kontakt.html
            /nikos-mietbedingungen.html
            /nikos-produkt-alarm.html
            /nikos-produkt-audio.html
            /nikos-produkt-clamp.html
            /nikos-produkt-dispatcher.html
            /nikos-produkt-flash.html
            /nikos-produkt-horn.html
            /nikos-produkt-led.html
            /nikos-produkt-moon.html
            /nikos-produkt-relay.html
            /nikos-produkt-xlr.html
            /nikos-produkte.html
            /nikos-referenzen.html
            /nikos-system.html
            /nikos-vergleich-uebertragungstechnik.html
            /nikos-vermietung-partner-werden.html
            /nikos-vermietung.html
          date-only: true

      - name: Sitemap auf verwaiste oder nicht indexierbare URLs prüfen
        run: node scripts/verify-sitemap.mjs sitemap.xml

      - name: Aktualisierte Sitemap zurückschreiben
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap ist aktuell; kein weiterer Commit erforderlich."
            exit 0
          fi
          git config user.name "nikos-sitemap-bot"
          git config user.email "nikos-sitemap-bot@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: Sitemap aus indexierbaren Seiten aktualisieren [skip ci]"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen (vermutlich andauernde Race-Situation) -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- vermutlich Race mit einem parallelen Workflow-Lauf. Rebase gegen origin/main und erneut versuchen …"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."

      - name: Sitemap-Statistik protokollieren
        run: |
          echo "Indexierbare URLs: ${{ steps.sitemap.outputs.url-count }}"
          echo "Ausgeschlossene URLs: ${{ steps.sitemap.outputs.excluded-count }}"
