name: "Fix: Bremen/Weihnachtsmarkt-Themenmismatch (2026-09-09)"

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"):
# siehe automation/lp-generator/scripts/reset-bremen-weihnachtsmarkt-mismatch.js
# fuer Hintergrund. Loescht die falsch betitelte Live-Seite
# loesungen/notfalldurchsage-weihnachtsmarkt-bremen/ und setzt die zugehoerige
# Sheet-Zeile (Problem=Besucherinformation, Einsatz=Weihnachtsmarkt,
# Region=Hamburg) zurueck, damit sie mit passendem Slug neu erzeugt wird.
#
# Ablauf Nutzer: 1) einmal OHNE Haken bei "live" laufen lassen (Dry-Run, Log
# pruefen), 2) danach erneut MIT Haken bei "live" laufen lassen. Nach
# erfolgreichem Live-Lauf kann dieser Workflow wieder entfernt werden.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Vorschau im Log)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fix-row:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Reset durchfuehren
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then
            node scripts/reset-bremen-weihnachtsmarkt-mismatch.js --live
          else
            node scripts/reset-bremen-weihnachtsmarkt-mismatch.js
          fi

      - name: Geloeschte Seite/Vorschau committen
        run: |
          git config user.name "nikos-lp-fix[bot]"
          git config user.email "actions@github.com"
          git add -A -- "loesungen" "lp-preview"
          if git diff --cached --quiet; then
            echo "Keine Aenderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "Falsch betitelte Bremen-Seite entfernt (Weihnachtsmarkt/Hamburg-Zeile wird neu erzeugt)"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- rebase gegen origin/main und erneut versuchen ..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."
