name: "Fix: fehlendes Sprachumschaltungs-Menue auf 112 Loesungen-Seiten (2026-09-10)"

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"):
# siehe automation/lp-generator/scripts/fix-missing-lang-switcher.js fuer
# Hintergrund. Nutzer-Meldung: bei manchen Loesungen-Seiten fehlt das
# Flaggen-Sprachumschaltungs-Menue oben rechts in der Nav komplett (Beispiel:
# besucherinformation-iga-ruhrgebiet-2027-dortmund). Untersuchung ergab: 112
# von 198 Seiten haben zwar die CSS dafuer (wird ausnahmslos ueberall von
# "Feinschliff" eingefuegt), aber das HTML-Element selbst fehlt -- eine
# historische Nachzueglerliste aelterer Seiten von VOR Einfuehrung dieses
# HTML-Blocks in den aktuellen Bau-Vorlagen (html_bauen.js/html_bauen_ml.js
# erzeugen das HTML bereits korrekt, neu erzeugte Seiten sind NICHT
# betroffen). Reiner HTML-Einfuege-Fix an einer bei allen 112 Seiten
# byte-identischen Stelle, KEINE KI-Aufrufe, KEINE Aenderung an
# Ueberschrift/Text/FAQ-Inhalten.
#
# Ablauf Nutzer: 1) ohne "live" laufen lassen (Dry-Run, Log pruefen --
# Anzahl "qualifizierend" muss 112 sein, 0 Anomalien). 2) mit "live" laufen
# lassen (kein limit noetig, reiner HTML-Einfuege-Fix ist ungefaehrlich).

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Diagnose im Log)'
        type: boolean
        default: false
      limit:
        description: 'Nur die ersten N qualifizierenden Seiten bearbeiten (leer lassen = alle)'
        type: string
        default: ''
      slug:
        description: 'Optional: nur genau diesen einen Seiten-Slug bearbeiten. Leer lassen = alle.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fix-lang-switcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sprachumschaltungs-HTML einfuegen
        working-directory: automation/lp-generator
        run: |
          ARGS=""
          if [ "${{ inputs.live }}" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug=${{ inputs.slug }}"; fi
          echo "Aufruf: node scripts/fix-missing-lang-switcher.js $ARGS"
          node scripts/fix-missing-lang-switcher.js $ARGS

      - name: Geaenderte Seiten committen
        run: |
          git config user.name "nikos-lp-fix[bot]"
          git config user.email "actions@github.com"
          git add -A -- "loesungen"
          if git diff --cached --quiet; then
            echo "Keine Aenderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "Fehlendes Sprachumschaltungs-Menue (lang-flag) auf aelteren Loesungen-Seiten ergaenzt (reiner HTML-Fix, kein Inhalts-Change)"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- rebase gegen origin/main und erneut versuchen ..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."
