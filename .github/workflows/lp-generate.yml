name: LP-Generator

# Produktiv-Workflow: ersetzt die deaktivierten n8n-Workflows "Landingpages erzeugen --
# Orchestrator" und "... Worker stabilisiert". Laeuft automatisch stuendlich und erzeugt
# bei Bedarf GENAU 1 neue Landingpage LIVE (echter Pfad lp-preview/<slug>/, echtes
# Sheet-Update in Keywordkombinationen) -- sofern freigegebene Kombinationen
# (erstellen=x) in der Warteschlange vorhanden sind (MAX=1 in lib/nodes/limit.js).
# "Landingpages veroeffentlichen" (separater n8n-Workflow, promotet preview->live)
# bleibt unveraendert aktiv.
# Der Test-Workflow "lp-generate-test.yml" bleibt unveraendert fuer manuelle
# Probelaeufe nach _ghtest-* erhalten.
# Details: /nikos/Migrationsplan_Landingpage-Generator_ohne-n8n_2026-08-27.md
#
# Zeitplan: alle 30 Minuten, um :15 und :45 (nicht :00/:30, siehe GitHub-Empfehlung gegen Lastspitzen). Grund fuer die Verdopplung (2026-09-03): GitHubs eigener Scheduler ueberspringt zeitgesteuerte Laeufe offenbar recht haeufig (beobachtet: mehrstuendige Luecken trotz stuendlichem Zeitplan, bei mehreren Workflows in diesem Repo) -- durch den doppelten Slot pro Stunde steigt die Chance, dass an jeder vollen Stunde mindestens 1 Lauf tatsaechlich stattfindet.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15,45 * * * *'

concurrency:
  group: lp-generate-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Landingpage generieren (LIVE)
        working-directory: automation/lp-generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index.js --live

      - name: Ergebnis committen (Vorschau + QA-Lektionen, ohne _ghtest-*)
        run: |
          git config user.name "nikos-lp-generator[bot]"
          git config user.email "actions@github.com"
          git add "lp-preview" "automation/lp-generator/data/qa-lektionen.json" 2>/dev/null || true
          git reset -- "lp-preview/_ghtest-*" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen (z. B. weil die Warteschlange leer war) -- nichts zu committen."
            exit 0
          fi
          git commit -m "Neue LP (GitHub-Actions-Generator, ohne n8n)"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen (vermutlich andauernde Race-Situation) -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- vermutlich Race mit einem parallelen Workflow-Lauf. Rebase gegen origin/main und erneut versuchen …"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."

      - name: Telegram-Erfolgsmeldung senden
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ NIKOS-Automation erfolgreich: LP-Generator
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
