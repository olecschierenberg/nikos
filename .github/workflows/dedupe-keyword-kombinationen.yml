name: "Fix: doppelte Keywordkombinationen bereinigen (2026-09-09)"

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"):
# siehe automation/lp-generator/scripts/dedupe-keyword-kombinationen.js fuer
# Hintergrund und Entscheidungsregel. Findet Zeilen mit identischer
# Problem+Einsatz+Region-Kombination und leert bei allen bis auf die
# "beste" (siehe Score-Regel im Skript) die Ablauf-Spalten, damit keine
# doppelte LP entstehen kann.
#
# Ablauf Nutzer: 1) einmal OHNE Haken bei "live" laufen lassen (Dry-Run,
# Log pruefen: zeigt jede Duplikat-Gruppe + Entscheidung + etwaige
# Konflikte), 2) danach erneut MIT Haken bei "live" laufen lassen.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Vorschau im Log)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Doppelte Keywordkombinationen bereinigen
        working-directory: automation/lp-generator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then
            node scripts/dedupe-keyword-kombinationen.js --live
          else
            node scripts/dedupe-keyword-kombinationen.js
          fi
