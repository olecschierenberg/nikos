name: "Fix: englische Verwandte-Links landeten auf deutscher Seitenansicht (2026-09-11)"

# EINMAL-WORKFLOW (nicht zeitgesteuert, nur manuell ueber "Run workflow"):
# siehe automation/lp-generator/scripts/fix-lang-persistence-footer-script.js
# fuer Hintergrund. Nutzer-Meldung: auf einer englischen Seitenansicht
# fuehrte ein englischer Link in der "More examples"-Box auf die deutsche
# Ansicht der Zielseite, obwohl der Linktext korrekt Englisch war. Ursache:
# der Sprachschalter-Bootstrap-<script>-Block auf jeder loesungen/<slug>/-
# Seite setzt eine gemerkte EN-Praeferenz beim Laden absichtlich wieder auf
# Deutsch zurueck (Schutz gegen zufaellig "mitgeschleppte" EN-Praeferenz aus
# anderen Website-Bereichen). Fix: verwandte_verlinken.js haengt an jeden
# Anker jetzt ?lang=de bzw. ?lang=en an; dieses Skript patcht den Bootstrap-
# Block auf allen bestehenden Seiten so, dass dieser URL-Parameter als
# hoechste Prioritaet gilt. Reiner Text-Ersatz im <script>-Block, KEINE
# KI-Aufrufe, KEINE Aenderung an Ueberschrift/Text/FAQ-Inhalten.
#
# Ablauf Nutzer: 1) ohne "live" laufen lassen (Dry-Run, Log pruefen -- Summe
# aus allen drei Varianten "qualifizierend" muss 198 sein, 0 Anomalien). 2)
# mit "live" laufen lassen (kein limit noetig, reiner Text-Ersatz-Fix ist
# ungefaehrlich).

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Diagnose im Log)'
        type: boolean
        default: false
      limit:
        description: 'Nur die ersten N qualifizierenden Seiten bearbeiten (leer lassen = alle)'
        type: string
        default: ''
      slug:
        description: 'Optional: nur genau diesen einen Seiten-Slug bearbeiten. Leer lassen = alle.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fix-lang-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sprachschalter-Bootstrap-Skript patchen
        working-directory: automation/lp-generator
        run: |
          ARGS=""
          if [ "${{ inputs.live }}" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug=${{ inputs.slug }}"; fi
          echo "Aufruf: node scripts/fix-lang-persistence-footer-script.js $ARGS"
          node scripts/fix-lang-persistence-footer-script.js $ARGS

      - name: Geaenderte Seiten committen
        run: |
          git config user.name "nikos-lp-fix[bot]"
          git config user.email "actions@github.com"
          git add -A -- "loesungen"
          if git diff --cached --quiet; then
            echo "Keine Aenderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "Sprachschalter-Bootstrap-Skript: ?lang=-URL-Parameter hat jetzt Vorrang vor gemerkter Praeferenz (Fix fuer Verwandte-Links auf falscher Sprache)"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- rebase gegen origin/main und erneut versuchen ..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."

