name: "Einmal-Fix: Slug-Sprache aller LPs (2026-09-25)"

# EINMAL-WORKFLOW (nur manuell): siehe automation/lp-generator/scripts/fix-slug-languages-2026-09-25.js.
# 1) ohne Haken "live" (Dry-Run, Log pruefen), 2) mit Haken "live". Danach kann der Workflow entfernt werden.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Wirklich schreiben (sonst nur Dry-Run/Vorschau im Log)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/lp-generator/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: automation/lp-generator
        run: npm install --omit=dev --no-audit --no-fund

      - name: Slugs korrigieren
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.live }}" = "true" ]; then
            node automation/lp-generator/scripts/fix-slug-languages-2026-09-25.js --live
          else
            node automation/lp-generator/scripts/fix-slug-languages-2026-09-25.js
          fi

      - name: Aenderungen committen
        run: |
          git config user.name "nikos-lp-fix[bot]"
          git config user.email "actions@github.com"
          git add -A -- "en/lp" "da/lp" "de/lp" "es/lp" "fr/lp" "it/lp" "nl/lp" "pl/lp" "lp-preview" "sitemap.xml" "loesungen/index.html"
          git reset -q -- "lp-preview/_ghtest-*" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "Slug-Sprach-Fix: 2 Live-LPs umbenannt (+Weiterleitung), 3 Vorschauen mit falschem Slug entfernt"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "Push nach $attempt Versuchen weiterhin fehlgeschlagen -- Abbruch."
              exit 1
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) -- rebase gegen origin/main und erneut versuchen ..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase fehlgeschlagen -- Abbruch."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
          echo "Push erfolgreich (Versuch $attempt)."
