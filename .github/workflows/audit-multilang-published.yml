name: Schritt-4-Audit: veroeffentlichte Mehrsprachen-LPs (rein lesend)

# Prueft ALLE Sheet-Zeilen mit pfad im neuen Schema (nikos.info/<lang>/lp/
# <slug>/) per HTTP, ob die Seite wirklich live ist. Hintergrund: bis zum
# Fix in .gitignore + lp-publish.yml (Commit a677ef3, lokal, wartet auf
# deploy.bat) wurde jede so veroeffentlichte Seite im Sheet als aktiv=x
# markiert, ohne dass die Datei je committet wurde -- dauerhaft 404.
# Schreibt NIE ins Sheet. Siehe automation/lp-generator/scripts/
# audit-multilang-published.js.

on: {workflow_dispatch: {}}

permissions: {contents: read}

jobs: {audit: {runs-on: ubuntu-latest, timeout-minutes: 5, steps: [{name: "Repo auschecken", uses: "actions/checkout@v4"}, {name: "Node.js einrichten", uses: "actions/setup-node@v4", with: {node-version: "22", cache: "npm", cache-dependency-path: "automation/lp-generator/package-lock.json"}}, {name: "Abhaengigkeiten installieren", working-directory: "automation/lp-generator", run: "npm install --omit=dev --no-audit --no-fund"}, {name: "Veroeffentlichte Mehrsprachen-LPs pruefen", working-directory: "automation/lp-generator", env: {GOOGLE_SERVICE_ACCOUNT_JSON: "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}"}, run: "node scripts/audit-multilang-published.js"}]}}
