<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKOS</title>
<meta name="description" content="Allgemeine Mietbedingungen (AMB) der RADACOM GmbH für die Vermietung von NIKOS-Systemen. Version 1.2, Stand: August 2025.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://nikos.info/de/mietbedingungen/">
<link rel="alternate" hreflang="de" href="https://nikos.info/de/mietbedingungen/">
<link rel="alternate" hreflang="en" href="https://nikos.info/en/rental-terms/">
<link rel="alternate" hreflang="x-default" href="https://nikos.info/de/mietbedingungen/">
<noscript><meta http-equiv="refresh" content="0; url=https://nikos.info/de/mietbedingungen/"></noscript>
<script>
(function () {
  var target = "https://nikos.info/de/mietbedingungen/";
  try {
    var saved = localStorage.getItem('nk-lang');
    if (saved === 'en') {
      target = "https://nikos.info/en/rental-terms/";
    } else if (saved !== 'de') {
      var bl = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
      if (bl.indexOf('en') === 0) { target = "https://nikos.info/en/rental-terms/"; }
    }
  } catch (e) {}
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>Diese Seite ist umgezogen. / This page has moved.<br>
<a href="https://nikos.info/de/mietbedingungen/">Deutsch</a> &middot; <a href="https://nikos.info/en/rental-terms/">English</a></p>
</body>
</html>
