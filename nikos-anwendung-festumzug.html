<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKOS</title>
<meta name="description" content="NIKOS für Festumzüge und Paraden: mit dem Zug wandernde Durchsagebereiche, Live-Positionsanzeige, Crowd-Management und Wegebeleuchtung – kabellos, autark.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://nikos.info/de/anwendungen/festumzug/">
<link rel="alternate" hreflang="de" href="https://nikos.info/de/anwendungen/festumzug/">
<link rel="alternate" hreflang="en" href="https://nikos.info/en/applications/parade/">
<link rel="alternate" hreflang="x-default" href="https://nikos.info/de/anwendungen/festumzug/">
<noscript><meta http-equiv="refresh" content="0; url=https://nikos.info/de/anwendungen/festumzug/"></noscript>
<script>
(function () {
  var target = "https://nikos.info/de/anwendungen/festumzug/";
  try {
    var saved = localStorage.getItem('nk-lang');
    if (saved === 'en') {
      target = "https://nikos.info/en/applications/parade/";
    } else if (saved !== 'de') {
      var bl = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
      if (bl.indexOf('en') === 0) { target = "https://nikos.info/en/applications/parade/"; }
    }
  } catch (e) {}
  window.location.replace(target);
})();
</script>
</head>
